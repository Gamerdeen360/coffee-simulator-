<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Simulator</title>
<style>
:root{--bg:#f6efe4;--fg:#2a1a10;--mute:#8a7560;--line:#e0d3bf;--card:#fbf7ef;--accent:#b5532a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150e0a;--fg:#f4e7d3;--mute:#a38d76;--line:#34261c;--card:#1f1610;--accent:#e58a58}}
:root[data-theme="dark"]{--bg:#150e0a;--fg:#f4e7d3;--mute:#a38d76;--line:#34261c;--card:#1f1610;--accent:#e58a58}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif}
.app{display:grid;grid-template-columns:210px 1fr;gap:28px;max-width:860px;margin:0 auto;padding:24px 20px 50px}
aside{position:sticky;top:20px;align-self:start;max-height:calc(100vh - 40px);overflow-y:auto}
aside h4{margin:0 0 8px;font-size:.68rem;letter-spacing:.22em;color:var(--mute);font-weight:500}
.it{display:flex;flex-direction:column;gap:2px;margin-bottom:20px}
.it button{background:none;border:0;color:var(--mute);text-align:left;font:inherit;font-size:.95rem;padding:6px 10px;border-left:2px solid var(--line);cursor:pointer;white-space:nowrap}
.it button:hover{color:var(--fg)}
.it button.on{color:var(--fg);border-left-color:var(--accent);font-weight:600}
.stage{min-width:0}
svg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
h2{margin:6px 0 4px;font-weight:300;font-size:1.9rem;letter-spacing:.04em;text-align:center}
#ds{margin:0 auto 18px;max-width:440px;text-align:center;color:var(--mute);line-height:1.5;font-size:.95rem}
#ch{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.c{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.82rem;background:var(--card)}
.c b{font-weight:600}
#rw{max-width:440px;margin:0 auto}
.r{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.r i{width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}
.r span{color:var(--mute);font-size:.8rem}
.r em{grid-column:2/4;height:3px;background:var(--line);border-radius:2px;overflow:hidden;font-style:normal;margin-top:-2px}
.r em u{display:block;height:100%;background:var(--accent)}
#tt{text-align:right;color:var(--mute);font-size:.8rem;padding-top:8px}
.st path{animation:rise 2.6s infinite ease-in-out;fill:none;stroke:var(--mute);stroke-width:3;stroke-linecap:round}
.st path:nth-child(2){animation-delay:.8s}.st path:nth-child(3){animation-delay:1.6s}
@keyframes rise{0%{opacity:0;transform:translateY(10px)}50%{opacity:.55}100%{opacity:0;transform:translateY(-14px)}}
@media(max-width:760px){
 .app{grid-template-columns:1fr;gap:10px;padding-top:14px}
 aside{position:static;max-height:none;overflow:visible;order:-1}
 .g{margin-bottom:6px}.it{flex-direction:row;overflow-x:auto;margin-bottom:8px;gap:6px}
 .it button{border:1px solid var(--line);border-radius:999px;padding:6px 14px}
 .it button.on{border-color:var(--accent)}
}
</style>
</head>
<body>
<div class="app">
<aside id="ls"></aside>
<section class="stage">
<svg viewBox="0 0 300 340" aria-hidden="true">
 <defs><clipPath id="cp"><path id="cpp"/></clipPath></defs>
 <line x1="30" y1="311" x2="270" y2="311" stroke="var(--line)" stroke-width="2"/>
 <ellipse id="sau" cx="150" cy="304" ry="7" fill="var(--line)"/>
 <path id="bd" fill="var(--card)"/>
 <g clip-path="url(#cp)"><g id="ly"></g><g id="ic"></g></g>
 <path id="ot" fill="none" stroke="var(--fg)" stroke-width="3" stroke-linejoin="round"/>
 <path id="hd" fill="none" stroke="var(--fg)" stroke-width="8" stroke-linecap="round"/>
 <line id="sw" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"/>
 <g id="sm" class="st"><path d="M-22 0q-8-10 0-20t0-20"/><path d="M0 0q-8-10 0-20t0-20"/><path d="M22 0q-8-10 0-20t0-20"/></g>
</svg>
<h2 id="nm"></h2>
<p id="ds"></p>
<div id="ch"></div>
<div id="rw"></div>
</section>
</div>
<script>
const $=id=>document.getElementById(id);
const K={espresso:["#3a1d10","c"],brew:["#5c3420","c"],water:["#8a5a3a","o"],milk:["#ecdcc2","m"],foam:["#fbf4e6","f"],choc:["#2b150d","o"],syrup:["#e0b14a","o"],caramel:["#c9801f","o"],cream:["#fffaf0","o"],gelato:["#f4e5c0","o"],blend:["#b78a63","o"],ice:["#cfe8ff","o"]};
const E="Espresso",H="Hot",I="Iced";
const D=[
[E,H,"demi","A concentrated shot pulled under pressure, topped with golden crema. The base of nearly everything else.",[[E,30,"espresso"]]],
["Ristretto",H,"demi","A shorter, 'restricted' shot. Sweeter and more syrupy, with less bitterness.",[["Ristretto shot",20,"espresso"]]],
["Doppio",H,"demi","A double espresso: two shots in one cup for a bold, intense hit.",[["Espresso (2 shots)",60,"espresso"]]],
["Lungo",H,"demi","A 'long' shot: more water through the same grounds, milder with a touch more bitterness.",[["Espresso (long pull)",60,"espresso"]]],
["Americano",H,"cup","Espresso lengthened with hot water for a smooth cup that sits close to filter coffee.",[[E,60,"espresso"],["Hot water",150,"water"]]],
["Macchiato",H,"demi","'Marked' espresso: a single shot stained with a small dollop of milk foam.",[[E,30,"espresso"],["Milk foam",15,"foam"]]],
["Cortado",H,"demi","Equal parts espresso and warm milk. Softens the acidity without hiding the coffee.",[[E,60,"espresso"],["Steamed milk",60,"milk"]]],
["Flat White",H,"cup","A double shot under velvety microfoam. Stronger and silkier than a latte.",[[E,60,"espresso"],["Steamed milk",90,"milk"],["Microfoam",10,"foam"]]],
["Cappuccino",H,"cup","Equal thirds of espresso, steamed milk and a thick cap of foam.",[[E,60,"espresso"],["Steamed milk",60,"milk"],["Milk foam",60,"foam"]]],
["Latte",H,"cup","Espresso with plenty of steamed milk and a thin layer of foam. Mellow and creamy.",[[E,60,"espresso"],["Steamed milk",180,"milk"],["Milk foam",15,"foam"]]],
["Mocha",H,"cup","A chocolatey latte: sauce, espresso, steamed milk and a little foam.",[["Chocolate sauce",30,"choc"],[E,60,"espresso"],["Steamed milk",120,"milk"],["Milk foam",15,"foam"]]],
["Caramel Macchiato",H,"cup","Vanilla syrup, steamed milk and foam, marked with espresso and a caramel drizzle.",[["Vanilla syrup",15,"syrup"],["Steamed milk",180,"milk"],["Milk foam",15,"foam"],[E,60,"espresso"],["Caramel drizzle",5,"caramel"]]],
["Café au Lait",H,"cup","Equal parts strong brewed coffee and hot milk. The French breakfast classic.",[["Brewed coffee",120,"brew"],["Steamed milk",120,"milk"]]],
["Espresso con Panna",H,"demi","Espresso crowned with a swirl of whipped cream.",[[E,60,"espresso"],["Whipped cream",40,"cream"]]],
["Affogato",H,"glass","A dessert: a scoop of vanilla gelato 'drowned' in a hot shot of espresso.",[["Vanilla gelato",70,"gelato"],[E,30,"espresso"]]],
["Iced Espresso",I,"glass","A double shot poured over ice for a strong, chilled sip.",[["Ice",80,"ice"],["Espresso (2 shots)",60,"espresso"]]],
["Iced Americano",I,"glass","Espresso and cold water over ice. Crisp, clean and refreshing.",[["Ice",120,"ice"],[E,60,"espresso"],["Cold water",150,"water"]]],
["Iced Latte",I,"glass","Espresso poured over cold milk and ice. Smooth and easy to drink.",[["Ice",120,"ice"],["Cold milk",180,"milk"],[E,60,"espresso"]]],
["Iced Cappuccino",I,"glass","Espresso with cold milk and a thick layer of cold foam over ice.",[["Ice",100,"ice"],[E,60,"espresso"],["Cold milk",60,"milk"],["Cold foam",60,"foam"]]],
["Iced Flat White",I,"glass","A double shot with cold milk over ice. Served shorter and stronger than an iced latte.",[["Ice",100,"ice"],["Cold milk",120,"milk"],[E,60,"espresso"]]],
["Iced Mocha",I,"glass","Chocolate, espresso and cold milk over ice with whipped cream on top.",[["Ice",120,"ice"],["Chocolate sauce",30,"choc"],["Cold milk",150,"milk"],[E,60,"espresso"],["Whipped cream",20,"cream"]]],
["Iced Caramel Macchiato",I,"glass","Vanilla syrup and cold milk over ice, marked with espresso and caramel.",[["Ice",120,"ice"],["Vanilla syrup",15,"syrup"],["Cold milk",180,"milk"],[E,60,"espresso"],["Caramel drizzle",5,"caramel"]]],
["Cold Brew",I,"glass","Coffee steeped in cold water for 12 to 18 hours. Low acidity and naturally sweet.",[["Ice",100,"ice"],["Cold brew",250,"brew"]]],
["Nitro Cold Brew",I,"glass","Cold brew infused with nitrogen: a creamy texture and a cascading foam head, served without ice.",[["Cold brew",250,"brew"],["Nitro foam",40,"foam"]]],
["Cold Foam Cold Brew",I,"glass","Cold brew over ice, finished with a layer of sweet, frothy cold foam.",[["Ice",100,"ice"],["Cold brew",200,"brew"],["Sweet cold foam",60,"foam"]]],
["Frappé",I,"glass","Coffee, milk and ice blended into a thick slush and topped with whipped cream.",[["Blended mix (coffee, milk, ice)",300,"blend",{c:60,m:120}],["Whipped cream",30,"cream"]]]
];
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const oz=m=>(m/29.57).toFixed(1);
function target(d){
  const L=d[4],liq=L.filter(l=>l[2]!="ice"),t=liq.reduce((a,l)=>a+l[1],0),ice=L.some(l=>l[2]=="ice");
  let w,wb,h;
  if(d[2]=="demi"){w=104+t*.35;wb=w*.6;h=62+t*.5}
  else if(d[2]=="cup"){w=136+t*.28;wb=w*.66;h=78+t*.36}
  else{w=112+t*.16;wb=w*.76;h=Math.min(262,132+t*.5)}
  return{w,wb,h,hd:d[2]=="glass"?0:1,ic:ice?1:0,sm:d[1]==H&&d[2]!="glass"?1:0,sa:d[2]=="glass"?0:1,fill:ice?.6:.86,
    ly:liq.map(l=>({c:rgb(K[l[2]][0]),f:l[1]/t}))};
}
function mix(a,b,e){
  const o={},lp=(x,y)=>x+(y-x)*e;
  for(const k of["w","wb","h","hd","ic","sm","sa","fill"])o[k]=lp(a[k],b[k]);
  const n=Math.max(a.ly.length,b.ly.length);o.ly=[];
  for(let i=0;i<n;i++){
    const x=a.ly[i]||{c:(b.ly[i]||b.ly[b.ly.length-1]).c,f:0},y=b.ly[i]||{c:x.c,f:0};
    o.ly.push({c:x.c.map((v,j)=>v+(y.c[j]-v)*e),f:lp(x.f,y.f)});
  }
  return o;
}
const cubes=[[-.22,-.05,12],[.14,-.1,-18],[-.04,.25,25],[.22,.2,-8],[-.18,.5,-22],[.08,.55,16]];
function render(s){
  const B=300,top=B-s.h,inner=s.h-8,L=150-s.w/2,R=150+s.w/2,l2=150-s.wb/2,r2=150+s.wb/2;
  const d=`M${L} ${top}L${l2} ${B-12}Q${l2+2} ${B} ${l2+13} ${B}L${r2-13} ${B}Q${r2-2} ${B} ${r2} ${B-12}L${R} ${top}Z`;
  ["cpp","bd","ot"].forEach(i=>$(i).setAttribute("d",d));
  let y=B-4,h="";
  s.ly.forEach(l=>{const ph=inner*s.fill*l.f;y-=ph;h+=`<rect x="0" y="${y}" width="300" height="${ph+.6}" fill="rgb(${l.c.map(Math.round)})"/>`});
  $("ly").innerHTML=h;
  const surf=B-4-inner*s.fill,sz=s.w*.2;
  $("ic").setAttribute("opacity",s.ic);
  $("ic").innerHTML=cubes.map(c=>`<rect x="${-sz/2}" y="${-sz/2}" width="${sz}" height="${sz}" rx="4" fill="rgba(200,230,255,.38)" stroke="rgba(255,255,255,.8)" stroke-width="1.5" transform="translate(${150+c[0]*s.w*.8} ${surf+c[1]*sz*1.4}) rotate(${c[2]})"/>`).join("");
  const xr=yy=>R-(R-r2)*(yy-top)/(B-12-top),y1=top+s.h*.22,y2=top+s.h*.6;
  $("hd").setAttribute("d",`M${xr(y1)} ${y1}C${xr(y1)+38} ${y1-4} ${xr(y2)+38} ${y2+4} ${xr(y2)} ${y2}`);
  $("hd").setAttribute("opacity",s.hd);
  const sw=$("sw");sw.setAttribute("x1",150+s.w*.06);sw.setAttribute("y1",B-30);sw.setAttribute("x2",150+s.w*.2);sw.setAttribute("y2",top-32);sw.setAttribute("opacity",s.ic);
  $("sm").setAttribute("transform",`translate(150 ${top-12})`);$("sm").setAttribute("opacity",s.sm);
  $("sau").setAttribute("rx",s.w*.68);$("sau").setAttribute("opacity",s.sa);
}
let cur=null,tok=0,sel=0;
function info(d){
  const L=d[4],liq=L.filter(l=>l[2]!="ice"),t=liq.reduce((a,l)=>a+l[1],0);
  let c=0,m=0,f=0;
  liq.forEach(l=>{const cat=K[l[2]][1],x=l[3];if(x){c+=x.c||0;m+=x.m||0}else if(cat=="c")c+=l[1];else if(cat=="m")m+=l[1];else if(cat=="f")f+=l[1]});
  $("nm").textContent=d[0];$("ds").textContent=d[3];
  $("ch").innerHTML=[["Coffee",c],["Milk",m],["Foam",f]].map(x=>`<div class="c">${x[0]} <b>${x[1]} ml</b></div>`).join("");
  const rows=[...L].reverse(),ice=rows.filter(l=>l[2]=="ice"),rest=rows.filter(l=>l[2]!="ice");
  $("rw").innerHTML=[...ice,...rest].map(l=>{
    const g=l[2]=="ice"||l[2]=="gelato",col=K[l[2]][0],pc=l[2]=="ice"?0:Math.round(l[1]/t*100);
    return`<div class="r"><i style="background:${col}"></i><div>${l[0]}</div><div>${l[1]} ${g?"g":"ml"} ${g?"":`<span>(${oz(l[1])} oz)</span>`}</div>${pc?`<em><u style="width:${pc}%"></u></em>`:""}</div>`}).join("")
    +`<div id="tt">Total liquid ≈ ${t} ml (${oz(t)} fl oz)</div>`;
}
function pick(i){
  sel=i;const d=D[i],tg=target(d),fr=cur||tg,t0=performance.now(),my=++tok;
  info(d);document.querySelectorAll(".it button").forEach(b=>b.classList.toggle("on",+b.dataset.i==i));
  (function st(n){if(my!=tok)return;const p=Math.min(1,(n-t0)/700),e=1-Math.pow(1-p,3);cur=mix(fr,tg,e);render(cur);if(p<1)requestAnimationFrame(st)})(t0);
}
$("ls").innerHTML=[H,I].map(g=>`<div class="g"><h4>${g.toUpperCase()}</h4><div class="it">${D.map((d,i)=>d[1]==g?`<button data-i="${i}">${d[0]}</button>`:"").join("")}</div></div>`).join("");
$("ls").onclick=e=>{if(e.target.dataset.i)pick(+e.target.dataset.i)};
document.addEventListener("keydown",e=>{if(e.key=="ArrowDown"||e.key=="ArrowRight"){e.preventDefault();pick((sel+1)%D.length)}if(e.key=="ArrowUp"||e.key=="ArrowLeft"){e.preventDefault();pick((sel+D.length-1)%D.length)}});
pick(8);
</script>
</body>
</html>
